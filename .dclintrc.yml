---
# Rules: https://github.com/zavoloklom/docker-compose-linter/blob/main/docs/rules.md
# Example Config: https://github.com/zavoloklom/docker-compose-linter/tree/main?tab=readme-ov-file#configuration
#
# Rules List: https://github.com/zavoloklom/docker-compose-linter/tree/main/docs/rules
# 0 -> Disabled
# 1 -> Warning
# 2 -> Error

$schema: "https://raw.githubusercontent.com/zavoloklom/docker-compose-linter/refs/heads/main/schemas/linter-config.schema.json"

rules:
  require-quotes-in-ports: 1
  service-image-require-explicit-tag: 0
  services-alphabetical-order: 0
  no-unbound-port-interfaces: 0
quiet: false
debug: false
exclude:
  - compose.config.yml
  - compose.override.yml
