---
configs:
  datasource.yml:
    name: datasource.yml
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: victoriametrics-metrics-datasource
          uid: victoriametrics
          access: proxy
          url: http://victoria-metrics:8428
          isDefault: true

        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: victorialogs
          access: proxy
          url: http://victoria-logs:9428
          jsonData:
            maxLines: 1000
