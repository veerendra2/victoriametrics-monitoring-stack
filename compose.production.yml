configs:
  fluent-bit.yml:
    content: |
      pipeline:
        inputs:
          - name: docker
            tag: docker_metrics
            path.containers: /host/var/lib/docker/containers
            path.sysfs: /host/sys/fs/cgroup

        outputs:
          - name: prometheus_exporter
            match_regex: '.*_metrics$'
            host: 0.0.0.0
            port: 2021
    name: fluent-bit.yml
services:
  fluent-bit:
    command:
      - --config=/config/fluent-bit.yml
    configs:
      - source: fluent-bit.yml
        target: /config/fluent-bit.yml
    container_name: fluent-bit
    hostname: fluent-bit
    image: fluent/fluent-bit:latest
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: /
        target: /host
        type: bind
      - bind:
          create_host_path: true
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
