---
name: fluent-bit
include:
  - compose.config.yml
services:
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: fluent-bit.yml
        target: /config/fluent-bit.yml
    command:
      - '--config=/config/fluent-bit.yml'
    restart: unless-stopped
    hostname: fluent-bit
    cpus: 0.5
    mem_limit: 64m
    mem_reservation: 16m
    networks:
      - victoria_logs_network

networks:
  victoria_logs_network:
    name: victoria_logs_network
    external: true
