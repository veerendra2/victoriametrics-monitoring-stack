---
name: fluent-bit
include:
  - compose.config.yml
services:
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    volumes:
      - /proc:/host/proc
      - /sys:/host/sys
      - /:/host:ro
    configs:
      - source: fluent-bit.yml
        target: /config/fluent-bit.yml
    ports:
      - '2021:2021'
    command:
      - '--config=/config/fluent-bit.yml'
    restart: unless-stopped
    hostname: fluent-bit
