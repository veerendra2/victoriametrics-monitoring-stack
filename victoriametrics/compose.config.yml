---
configs:
  scrape.yaml:
    name: scrape.yaml
    content: |
      ---
      scrape_configs:
      - job_name: victoriametrics
        static_configs:
        - targets:
          - http://localhost:8428

      - job_name: fluent-bit
        static_configs:
        - targets:
          - fluent-bit:2021

      - job_name: speedtest_exporter
        scrape_interval: 1h
        scrape_timeout: 2m
        static_configs:
        - targets:
          - speedtest_exporter:8080
