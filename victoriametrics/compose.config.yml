---
configs:
  scrape.yaml:
    name: scrape.yaml
    content: |
      ---
      global:
        scrape_interval: 30s

      scrape_configs:
      - job_name: victoriametrics
        static_configs:
        - targets:
          - localhost:8428

      - job_name: fluent-bit
        static_configs:
        - targets:
          - fluent-bit:2021

      - job_name: speedtest_exporter
        scrape_interval: 1h
        scrape_timeout: 2m
        static_configs:
        - targets:
          - speedtest_exporter:8080

      - job_name: blackbox_exporter
        metrics_path: /probe
        params:
          module: [http_2xx]
        file_sd_configs:
        - files:
          - /pinghosts.yml
        relabel_configs:
        - source_labels: [__address__]
          regex: "(.*);(.*)"
          target_label: instance
          replacement: $1
        - source_labels: [__address__]
          regex: "(.*);(.*)"
          target_label: humanname
          replacement: $2
        - source_labels: [module]
          target_label: http_module
        - source_labels: [group]
          target_label: group
        - source_labels: [instance]
          target_label: __param_target
        - source_labels: [module]
          target_label: __param_module
        - target_label: __address__
          replacement: blackboxexporter:9115

  pinghosts.yml:
    name: pinghosts.yml
    content: |
      ---
      - targets:
          - https://www.google.com;Google
          - https://duckduckgo.com;DuckDuckGo
        labels:
          module: http_2xx
          group: generic
