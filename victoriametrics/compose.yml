---
name: victoria-metrics
include:
  - compose.config.yml

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoria-metrics
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
    configs:
      - source: scrape.yaml
        target: /scrape.yaml
        mode: 444
    ports:
      - '8428:8428'
    networks:
      - victoria_metrics_network
    command:
      - '-promscrape.config=/scrape.yaml'
      - '-retentionPeriod=30d'
      - '-smallMergeConcurrency=1'
      - '-bigMergeConcurrency=1'
      - '-memory.allowedPercent=70'
      - '-dedup.minScrapeInterval=30s'
    restart: unless-stopped
    cpus: 0.5
    hostname: victoria-metrics
    mem_limit: 256m
    mem_reservation: 64m

networks:
  victoria_metrics_network:
    name: victoria_metrics_network
    attachable: true
volumes:
  victoria_metrics_data:
    name: victoria_metrics_data
